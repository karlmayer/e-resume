work:
  - name: Eli Lilly, Digital Core
    position: Sr. Director & Lead Architect
    url: https://www.lilly.com/
    startDate: "2022-01-02"
    summary: >
      Architecture lead for Lilly's Digital Core, spanning Engineering,
      Enterprise Data, Cloud, Service Management, Digital Employee Experience,
      and Mobility, driving platform strategy, AI-native tooling, and
      technology governance in close partnership with Enterprise Data architects
      and product owners.
    highlights:
      - >
        Leading architecture and engineering for three AI products on Lilly's
        Cortex AI Platform: ChatNow (600+ users, delivered 2-3 months early),
        Finance Agentic Transformation (alpha delivered within first month), and
        Fuse, a Digital Core Marketplace for technology products and services.
        Driving agentic workflow design, API integration patterns, and platform
        capability exploitation across all three.
      - >
        Chair the Digital Core Architecture x Innovation Council, driving architectural
        excellence, resolving organizational cross-cutting concerns, and
        accelerating innovation pull-through across Digital Core capabilities.
      - >
        Own TechHQ, a technology knowledge platform where architects across
        Tech@Lilly contribute technology positioning, guidance, and next steps
        to equip architects and technical leaders with authoritative ecosystem
        knowledge. Now serving as a primary knowledge source for grounding AI
        with accurate context about Lilly's technology landscape.
      - >
        Led DevX Program with 2,500+ participants, delivering developer
        experience savings through AI pair programmers, knowledge reuse, and
        streamlined onboarding across 80+ engineers in 15+ repositories.
      - >
        Serve as Business Relationship Manager to Digital Office / Global
        Services, representing Digital Core strategic priorities across HR,
        Finance, and Legal functions, directly informing AI transformation
        initiatives including Finance Agentic Transformation.
  - breakBefore: true
    name: Eli Lilly, Research Information & Digital Solutions
    position: Director of Technology & Platforms
    url: https://www.lilly.com/
    endDate: "2021-12-30"
    startDate: "2020-03-02"
    summary: >
      Managed a globally distributed team of 20 engineers and informaticians
      responsible for engineering and operations of biology, chemistry, and
      analytical chemistry research systems, with architectural risk oversight
      of the Benchling and Biologica large molecule implementation, and active
      participation on the electronic Lab Notebook (eLN) Steering Team.
    highlights:
      - >
        Owned PerkinElmer Signals, Genedata Screener, and Agilent OpenLAB
        platforms, including vendor management with Agilent; contributed to
        early PerkinElmer Signals deployment strategy and drove architecture
        standards for HTS and analytical chemistry data capture and integration
        across chemistry research workflows.
      - >
        Led architecture and delivery of Thalamus, a Kafka-based platform to
        ingest and aggregate analytical lab data in real time, capturing raw
        instrument data with full scientific context — modernizing legacy
        home-grown systems, reducing dependency on costly LIMS platforms, and
        establishing a scalable foundation for scientific computing.
      - >
        Sponsored CATS, the GitOps Kubernetes platform, saving 9,000+ developer
        hours in year one, and AWS onboarding and Kafka data aggregation
        platforms to modernize data infrastructure across biology, chemistry,
        and analytical research workflows.
      - >
        Contributed to Research.Data, Lilly's enterprise research data
        ecosystem, bringing deep domain expertise across compound registration,
        assay and screening data, in vivo and in vitro results, large and small
        molecule data, ELN data, and genomics/proteomics — ensuring
        comprehensive domain coverage and unified scientific data access across
        research organizations.


  - name: Eli Lilly, Research Information & Digital Solutions
    position: Security Advisor
    url: https://www.lilly.com/
    endDate: "2020-03-01"
    startDate: "2018-01-02"
    summary: >
      Served as embedded architect and security lead for LRL, reporting to the
      Sr. VP of Lilly Research Labs. Brought deep security-by-design expertise
      and architectural leadership to the Research information security
      portfolio, leading AWS Well-Architected reviews, risk assessments, threat
      modeling, and risk management frameworks. Developed executive dashboards
      and KPIs for VP and AVP audiences integrating ServiceNow, Archer IRM, and
      cloud sources.
    highlights:
      - >
        Architected integrated analytics and reporting frameworks combining
        ServiceNow, Archer IRM, and cloud data sources into unified Tableau
        dashboards, delivering actionable insights to VP and AVP stakeholders
        across security and compliance domains.
      - >
        Led Collaboration Informatics solution to provision cloud data science
        environments; engaged infrastructure teams to accelerate
        High-Performance Computing in AWS, Clinical Data for Research, and a
        Kubernetes-based data science platform.
      - >
        Collaborated with Advanced Analytics & Data Science (AADS) on
        integration patterns and data infrastructure strategy for the Enterprise
        Data Backbone, and co-chaired the AADS Visual Analytics Community of
        Practice with 60–80 monthly participants.
      - >
        Led enterprise-wide technology assessment of 35+ security-critical
        systems, developing recommendations that eliminated 82 B2B VPNs and
        transitioned 7 business-supported systems to IT.


  - name: Eli Lilly, Medicines Development Information & Digital Solutions
    position: Clinical Results Architect
    url: https://www.lilly.com/
    endDate: "2017-12-31"
    startDate: "2013-01-01"
    summary: >
      Domain architect for Clinical Data Flow, Biometrics, and Product & Project
      Management systems. Led foundational data architecture, data pipeline
      strategy, and clinical risk measurement frameworks.
    highlights:
      - >
        Founding member of Medicine Development's Architecture Office; owned
        clinical business architecture strategy, data models, and accompanying
        artifacts spanning chemical, biological, and clinical data domains.
      - >
        Led architecture for Clinical Data Flow, an 8-month multi-million-dollar
        cloud platform RFP with a 3-year data pipeline roadmap spanning 10
        source systems; co-architected the MD-IDS InfoHub, unifying data access
        across medicine development informatics and clinical systems.
      - >
        Designed CLUWE, a statistical computing environment for clinical data
        that replaced multiple SAS systems and manual business processes,
        serving statisticians and clinical data managers. Led a 20+ person team
        through scoping, prioritization, and delivery; the platform remains in
        production to this day.
      - >
        Directed LogicView, a centralized solution for clinical patient safety
        and data quality monitoring, delivering $10M in first-year savings. Grew
        team to 12, managed budget, and oversaw development for 13 studies and
        60+ analytics. Influenced industry standards for measuring clinical
        trial risk.
      - >
        Contributing author on the TransCelerate BioPharma Risk-Based Monitoring
        Technology White Paper, helping define industry standards for clinical
        risk assessment and monitoring.
      # - >
      #   Developed an interactive Tableau map of migraine patient density,
      #   enabling discovery of two additional study sites with previously
      #   unrecognized patient saturation.

  - breakBefore: true
    name: Eli Lilly, Lilly Research Labs
    position: Solution Delivery Consultant
    url: https://www.lilly.com/
    endDate: "2013-12-31"
    startDate: "2011-01-01"
    summary: >
      Technical lead and systems engineer for Discovery IT systems, including
      RRL (Research Results Loader), CSI (Crowd-Sourced Intelligence), and the
      LRL Data Hub research data ecosystem.
    highlights:
      - >
        Led RRL, a web-based self-service data ingestion platform supporting
        verification and loading of tens of thousands of datasets across dozens
        of external research collaborations — a production-grade system in
        continuous use for over a decade.
      - >
        Directed a team of 8 engineers designing CSI, a competitive intelligence
        data mining solution leveraging semantic web linked data.
      - >
        Rehosted and refactored a portfolio of a dozen translational research
        systems from Singapore to the US in 3 months, encompassing two data
        center migrations, multiple databases, and .NET, Java, and R codebases.
      - >
        Co-architected the LRL Data Hub with ResultWorks, developing formal
        entity-relationship models, ontologies, and logical architecture across
        core research data domains including compound registration, assay and
        screening data, in vivo and in vitro results, and genomics/proteomics —
        a foundational effort that served as the conceptual precursor to the
        MD-IDS InfoHub and Research.Data ecosystems.

  - name: Eli Lilly, Lilly Research Labs
    position: Sr. Systems Engineer
    url: https://www.lilly.com/
    endDate: "2010-12-31"
    startDate: "2006-01-01"
    summary: >
      Technical lead and systems engineer for Discovery IT systems with a focus
      on scientific data integration, linked data and ontology strategies, and
      bespoke research informatics solutions.
    highlights:
      - >
        2-year product lead for DTAT, a discovery research platform used by 500
        LRL scientists, developed by 15+ engineers across the US, Europe, and
        Singapore. Surfaced genomics, proteomics, competitive intelligence, and
        Research wikis across 22 modules. Automated months of manual curation
        with a competitor drug landscape module.
      - >
        Designed the In Vitro Results Sweeper, a custom ETL engine with an XML
        DSL that replaced 3 ETL systems and supported 15 external scientific
        collaborations through schema-driven, reusable data integration.
      - >
        Spearheaded adoption of Semantic Web technology for linked data,
        including graph databases, OWL ontologies, and SPARQL — foundational
        experience in controlled vocabularies and interoperable data models that
        continues to inform current work in knowledge graphs and AI-native
        data infrastructure.
      - >
        Three-year contributor to Microsoft's ASP.NET Web API and Open Data
        advisory groups, shaping interoperable API standards.


  - name: Eli Lilly, Global Business Integration Project
    position: Systems Analyst
    url: https://www.lilly.com/
    endDate: "2005-12-31"
    startDate: "2002-01-01"
    summary: Training administration solutions technical lead
    highlights:
      - >-
        Introduced automated testing of the GMP-validated training system to
        increase change velocity and decrease defects.
      - >-
        Doubled the efficiency of training data EDI with SAP and designed GBIP's
        first SOAP web service to integrate a MES (Manufacturing Execution
        System) in Sesto, Italy.
      - >-
        Redesigned database schema and migrated 40M records, reducing report
        query times from hours to seconds.

  - name: Ready Machine Corporation
    position: Systems Administrator, concurrent with university studies
    endDate: "2002-01-01"
    startDate: "2000-01-01"
    summary: >-
      Sole IT professional for a 40-employee tool & die business. Procured
      software and hardware, installed Ethernet network, and designed a custom
      inventory system integrated with a commercial ERP solution.

