  name: Karl Mayer
  label: Sr. Director & Lead Architect
  image: ""
  email: karl.mayer@lilly.com
  # url: http://karlmayer.dev

  summary: >
    Strategic technology leader with 20+ years of experience in enterprise data
    architecture, scientific informatics, and cross-functional platform
    leadership in pharma and biotech. Deep background designing scalable data
    infrastructure, enabling AI/ML-ready systems, and translating complex
    scientific needs into foundational data and software platforms.

    Proven track record building enterprise data ecosystems, leading
    multidisciplinary architecture teams in matrixed global organizations, and
    championing data quality, governance, and FAIR principles. Deep domain
    expertise across the scientific data types that underpin molecule discovery:
    compound registration, assay and screening data, in vivo and in vitro
    results, LIMS, ELN, and genomics/proteomics. Experienced partnering across
    research, informatics, cybersecurity, and executive stakeholders to align
    technology strategy with scientific mission.

    Guiding philosophies: <i>◇ Architecture externalizes assumptions.
    &nbsp;&nbsp;◇ Script the critical moves. &nbsp;&nbsp;◇ Simplicity is an
    applied force.
